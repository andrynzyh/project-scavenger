# Deploy ke GitHub Pages — jalan otomatis saat ada push ke main.
#
# Requirements (sekali setup di repo):
# 1. Repo Settings → Pages → Source: "GitHub Actions"
# 2. Tambahkan repository secret ADMIN_PASSWORD berisi password admin lama.
#    Workflow membuat SHA-256 saat build; password tidak masuk source atau log.
# 3. Repo Settings → Environments → protected environment "github-pages"
#    (workflow ini memakai token environment github-pages bawaan).
#
# Target: https://andrynzyh.github.io/project-scavenger/  (site + base /project-scavenger di astro.config.mjs)
# Semua internal links memakai withBase()/remarkBaseLinks — deploy harusnya
# berfungsi tanpa perubahan kode apa pun.

name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Hash admin credential
        id: admin-hash
        shell: bash
        run: |
          if [ -z "${ADMIN_PASSWORD}" ]; then
            echo "ADMIN_PASSWORD repository secret is required." >&2
            exit 1
          fi
          hash="$(node -e "const crypto = require('node:crypto'); process.stdout.write(crypto.createHash('sha256').update(process.argv[1]).digest('hex'))" "$ADMIN_PASSWORD")"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Build Astro
        env:
          PUBLIC_ADMIN_CREDENTIAL_HASH: ${{ steps.admin-hash.outputs.hash }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4