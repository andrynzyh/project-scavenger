# Deploy ke GitHub Pages — jalan otomatis saat ada push ke main.
#
# Requirements (sekali setup di repo):
# 1. Repo Settings → Pages → Source: "GitHub Actions"
# 2. (opsional) Repo Settings → Environments → protected environment
#    "github-pages" (workflow ini memakai token environment bawaan).
#
# Target: https://andrynzyh.github.io/project-scavenger/  (site + base /project-scavenger di astro.config.mjs)
# Semua internal links memakai withBase()/remarkBaseLinks — deploy harusnya
# berfungsi tanpa perubahan kode apa pun.

name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4